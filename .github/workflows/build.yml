name: Build Windows app

on:
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  release:
    types: [published]      # runs when you publish a GitHub Release

permissions:
  contents: write           # needed to attach files to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable exe
        run: npm run dist

      - name: Save the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyClock-Windows
          path: |
            dist/*.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
